name: Generate Quiz Data

on:
  # 手動実行ボタンを有効化
  workflow_dispatch:
  # 例: 毎日深夜0時に自動実行したい場合（UTC基準）
  # schedule:
  #   - cron: '0 15 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. コードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js のセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 依存ライブラリのインストール
      - name: Install dependencies
        run: npm ci

      # 4. スクリプトの実行（Secrets 経由で API キーを渡す）
      - name: Run quiz generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate

      # 5. 生成された quiz.json をリポジトリに Commit & Push
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate quiz.json" && git push)